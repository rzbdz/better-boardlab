# The full test suite for a release. It runs only when a version tag is pushed (a release), never on every commit:
# day-to-day work is tested locally, and a release is tested once, in public.
name: ci
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm check
      - run: pnpm run build
      - run: pnpm test -- --maxWorkers=2
